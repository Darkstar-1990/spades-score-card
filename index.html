<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>Spades Score Card</title>
<style>
:root{
  --felt:#0c3326;--felt2:#124734;--felt3:#1b5e45;
  --paper:#ffffff;--paper2:#f5f7f6;--ink:#17201c;--muted:#6a7570;--line:#e6ebe8;
  --gold:#f2c14e;--gold-ink:#3d2e00;
  --good:#16a35a;--good-bg:#e7f7ee;--bad:#d64535;--bad-bg:#fdecea;
  --r:16px;--shadow:0 6px 18px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--felt);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#09281e 0%,var(--felt) 100%);padding:12px 16px 12px;color:#fff}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:18px;font-weight:800;flex:1;letter-spacing:.2px}
.iconbtn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;height:38px;min-width:38px;padding:0 12px;font-size:14px;font-weight:700}
.goal{margin-top:10px}
.goal-txt{display:flex;justify-content:space-between;font-size:13px;color:#cfe5da}
.goal-txt b{color:var(--gold)}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f2c14e,#ffdf8a);border-radius:8px;transition:width .5s ease}

/* ---------- layout ---------- */
main{max-width:560px;margin:0 auto;padding:14px 14px 170px}
.card{background:var(--paper);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.eyebrow{color:#a9cdbd;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin:6px 2px 10px}

/* ---------- avatars ---------- */
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.av.lg{width:58px;height:58px;font-size:20px}

/* ---------- segmented step indicator ---------- */
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:14px;padding:4px;margin-bottom:14px}
.seg div{flex:1;text-align:center;padding:10px 6px;border-radius:10px;color:#bcd8cb;font-weight:700;font-size:14px}
.seg div.on{background:#fff;color:var(--felt)}
.seg div.done{color:#fff}
.seg span{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;margin-right:6px;background:rgba(255,255,255,.18)}
.seg div.on span{background:var(--felt);color:#fff}

/* ---------- player rows ---------- */
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:12px;color:var(--muted);margin-top:2px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;background:var(--paper2);color:var(--muted)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.stepper{display:flex;align-items:center;background:var(--paper2);border-radius:14px;padding:3px}
.stepper button{width:44px;height:44px;border:0;border-radius:11px;background:#fff;color:var(--felt);font-size:22px;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper button:active{transform:scale(.94)}
.stepper input{width:44px;border:0;background:transparent;text-align:center;font-size:20px;font-weight:800;color:var(--ink);padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input::placeholder{color:#b9c2be}
.stepper.filled{background:#fff6d6}

/* ---------- summary pill ---------- */
.pill{display:flex;align-items:center;justify-content:space-between;background:var(--paper2);border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700}
.pill .big{font-size:22px}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:#fff4dc;color:#9a6400}
.pill.bad{background:var(--bad-bg);color:var(--bad)}

/* ---------- bottom action bar (thumb zone) ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:64px;z-index:9;padding:10px 14px;background:linear-gradient(180deg,rgba(12,51,38,0),var(--felt) 35%)}
.actionbar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:800;flex:1;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--gold);color:var(--gold-ink);box-shadow:0 6px 16px rgba(242,193,78,.35)}
.btn.secondary{background:rgba(255,255,255,.14);color:#fff;flex:0 0 auto;padding:16px 18px}
.btn.light{background:var(--paper2);color:var(--felt);width:100%}
.btn.danger{background:var(--bad-bg);color:var(--bad);width:100%}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.block{width:100%;display:block}

/* ---------- bottom tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:11;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs .inner{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;color:#8a948f;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;height:64px}
.tabs button .ic{font-size:21px;line-height:1}
.tabs button.on{color:var(--felt)}
.tabs button.on .ic{transform:translateY(-1px)}

/* ---------- leaderboard ---------- */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:8px 0 4px}
.pod{flex:1;text-align:center;max-width:120px}
.pod .av{margin:0 auto 6px}
.pod .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .sc{font-weight:800;font-size:18px}
.pod .block{margin-top:8px;border-radius:12px 12px 4px 4px;color:#fff;font-weight:900;font-size:22px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.pod.p1 .block{height:88px;background:linear-gradient(180deg,#f2c14e,#d9a32a);color:var(--gold-ink)}
.pod.p2 .block{height:64px;background:linear-gradient(180deg,#c9d2ce,#a8b3ae)}
.pod.p3 .block{height:48px;background:linear-gradient(180deg,#d9a07a,#b97b55)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrank{width:22px;text-align:center;font-weight:900;color:var(--muted)}
.lrow .bar{background:var(--paper2);height:6px;margin-top:6px}
.lrow .bar i{background:var(--felt3)}
.lscore{font-weight:900;font-size:19px;text-align:right}
.lscore small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.mv{font-size:11px;font-weight:800;margin-left:6px}
.mv.up{color:var(--good)}.mv.down{color:var(--bad)}
.neg{color:var(--bad)}

/* ---------- history table ---------- */
.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:#fff}
td.h{color:var(--muted);font-weight:800}
td small{display:block;color:var(--muted);font-size:10px}
tfoot td{font-weight:900;border-top:2px solid var(--ink);border-bottom:0;font-size:14px}
.x{border:0;background:none;color:#b3bcb8;font-size:16px;padding:4px 8px}

/* ---------- settings ---------- */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow label{font-weight:700}
.srow label small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.srow input.num{width:80px;font-size:18px;font-weight:800;text-align:center;padding:10px;border:0;border-radius:12px;background:var(--paper2)}
.nameinp{flex:1;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:12px;background:var(--paper2);min-width:0}
.rm{border:0;background:var(--bad-bg);color:var(--bad);width:44px;height:44px;border-radius:12px;font-size:18px;flex:none}

/* ---------- setup screens ---------- */
.hero{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;text-align:center;color:#fff;padding:20px 8px 40px}
.hero .logo{font-size:110px;line-height:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35))}
.hero h2{font-size:30px;margin:14px 0 8px;font-weight:900}
.hero p{color:#b8d6c8;margin:0 0 36px;font-size:16px}
.hero .btn{display:block;width:100%;margin-top:12px;flex:none}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 16px}
.dots i{width:28px;height:6px;border-radius:6px;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--gold)}
.counter{display:flex;align-items:center;justify-content:center;gap:24px;margin:18px 0 20px}
.counter button{width:68px;height:68px;border-radius:50%;border:0;background:var(--felt2);color:#fff;font-size:34px;font-weight:700}
.counter .n{font-size:72px;font-weight:900;min-width:100px;text-align:center;color:var(--felt)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:0;background:var(--paper2);border-radius:12px;padding:12px 0;font-weight:800;font-size:16px;color:var(--ink)}
.quick button.on{background:var(--felt2);color:#fff}
.back{background:none;border:0;color:#cfe5da;font-size:15px;font-weight:700;padding:4px 0 10px}

/* ---------- sheets / overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,20,14,.6);z-index:30;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex;animation:fade .2s}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 16px 22px;animation:up .25s ease}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:#d8dfdb;margin:0 auto 12px}
.sheet h2{margin:0 0 4px;font-size:20px}
.dialog{align-items:center;padding:20px}
.dialog .sheet{border-radius:20px}
.res{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.delta{font-weight:900;font-size:20px;min-width:70px;text-align:right}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}
.win{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 35%,#1f6a4f,#07211a 70%);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px}
.win.on{display:flex;animation:fade .3s}
.win .trophy{font-size:96px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.win h2{font-size:34px;margin:8px 0;font-weight:900}
.win p{color:#cfe5da;margin:0 0 28px}
.win .btn{width:100%;max-width:340px;margin-top:10px;flex:none}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:41}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
.toast{position:fixed;left:50%;top:96px;bottom:auto;transform:translateX(-50%) translateY(20px);background:#17201c;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:50;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--gold);font-weight:800;font-size:14px;padding:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes bump{50%{transform:scale(1.18)}}
.bump{animation:bump .25s}

/* ===== Black-text light theme overrides ===== */
:root{--ink:#000;--muted:#000;--bg:#eef3f0}
html,body{background:var(--bg);color:#000}
.top{background:#fff;color:#000;border-bottom:1px solid #dfe6e2;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.goal-txt,.goal-txt b{color:#000}
.top .bar{background:#e3e9e6}
.iconbtn{background:#eef2f0;color:#000}
.sidebtn{background:var(--gold);font-weight:900}
.eyebrow{color:#000}
.sub,.pmeta,.lrank,.lscore small,th,td.h,td small,.srow label small,.pnum{color:#000}
.seg{background:#dde5e1}
.seg div,.seg div.done{color:#000}
.seg div.on{background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg span{background:rgba(0,0,0,.08);color:#000}
.seg div.on span{background:#000;color:#fff}
.actionbar{background:linear-gradient(180deg,rgba(238,243,240,0),var(--bg) 35%)}
.btn.primary{color:#000}
.btn.secondary{background:#dde5e1;color:#000}
.btn.light{color:#000}
.btn.danger{color:#000;background:#fbdcd8}
.hero,.hero p,.hero h2{color:#000}
.hero .logo{filter:none}
.dots i{background:rgba(0,0,0,.15)}
.back{color:#000}
.counter .n{color:#000}
.quick button{color:#000}
.quick button.on{background:#000;color:#fff}
.tabs button{color:#000;font-weight:600}
.tabs button.on{color:#000;font-weight:900;box-shadow:inset 0 3px 0 var(--gold)}
.pill,.pill.warn{color:#000}
.pill.good{color:#000}
.pill.bad{color:#000}
.chip,.chip.good,.chip.bad{color:#000}
.stepper input,.stepper button,.nameinp,.srow input.num{color:#000}
.stepper input::placeholder,.nameinp::placeholder{color:#555}
.x{color:#000}
.rm{color:#000}
.pod .nm,.pod .sc{color:#000}
.pod.p2 .block,.pod.p3 .block{color:#000}
.mv.up,.mv.down{color:#000}
.win{background:radial-gradient(circle at 50% 35%,#ffffff,#e2ece7 70%);color:#000}
.win p,.win h2{color:#000}
.win .btn.secondary{background:#dde5e1;color:#000}
.toast{background:#fff;color:#000;border:1px solid #dfe6e2;white-space:nowrap}
.toast button{color:#000;text-decoration:underline}

/* ===== side leaderboard ===== */
.layout{max-width:560px;margin:0 auto}
.side{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.side h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:6px}
.side .sub{margin-bottom:8px}
.srank{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:12px}
.srank.first{background:#fff6d6}
.srank .n{width:18px;text-align:center;font-weight:900}
.srank .av{width:32px;height:32px;font-size:12px}
.srank .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srank .sc{font-weight:900;font-size:16px;text-align:right}
.srank .sc small{display:block;font-size:10px;font-weight:600}
.edge{position:fixed;right:0;top:44%;z-index:12;border:0;background:var(--gold);color:#000;border-radius:14px 0 0 14px;padding:10px 8px 10px 10px;box-shadow:var(--shadow);font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.edge .ic{font-size:20px}
.sidescrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
.sidescrim.on{display:block}
@media (max-width:759px){
  .side{position:fixed;top:0;right:0;bottom:0;width:80%;max-width:320px;z-index:26;border-radius:20px 0 0 20px;overflow:auto;transform:translateX(105%);transition:transform .25s ease;padding-top:20px}
  .side.open{transform:none}
}
@media (min-width:760px){
  .layout{max-width:1000px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
  .layout.noside{grid-template-columns:minmax(0,560px);justify-content:center}
  .side{position:sticky;top:110px}
  .sidebtn,.sidescrim{display:none!important}
  main{max-width:1000px}
  .actionbar .inner,.tabs .inner{max-width:1000px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top" id="top">
  <div class="top-row">
    <h1>♠ Spades Score Card</h1>
    <button class="iconbtn sidebtn hide" id="edge" aria-label="Show leaderboard">🏆 <span id="edgeTxt"></span></button><button class="iconbtn" id="goHome" aria-label="Home">⌂</button>
  </div>
  <div class="goal" id="goal"></div>
</div>

<main><div class="layout" id="layout"><div class="content">
  <section id="setup"></section>
  <section id="tab-play" class="hide"></section>
  <section id="tab-board" class="hide"></section>
  <section id="tab-history" class="hide"></section>
  <section id="tab-settings" class="hide"></section>
</div><aside class="side hide" id="side"></aside></div></main>
<div class="sidescrim" id="sidescrim"></div>

<div class="actionbar hide" id="actionbar"><div class="inner" id="actions"></div></div>

<nav class="tabs hide" id="tabs"><div class="inner">
  <button data-tab="play"><span class="ic">🂡</span>Play</button>
  <button data-tab="board"><span class="ic">🏆</span>Leaderboard</button>
  <button data-tab="history"><span class="ic">📋</span>Scores</button>
  <button data-tab="settings"><span class="ic">⚙︎</span>Settings</button>
</div></nav>

<div class="scrim" id="sheet"><div class="sheet" id="sheetBody"></div></div>
<div class="scrim dialog" id="dialog"><div class="sheet"><h2 id="dTitle"></h2><p class="sub" id="dText"></p><div style="display:flex;gap:10px"><button class="btn light" id="dNo">Cancel</button><button class="btn danger" id="dYes">Yes</button></div></div></div>
<div class="win" id="win"></div>
<div class="confetti" id="confetti"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct" class="hide">Undo</button></div>

<script>
/* ================= state ================= */
const KEY="spades-score-card-v1";
const FRUITS=[["Mango","🥭"],["Banana","🍌"],["Cherry","🍒"],["Kiwi","🥝"],["Grape","🍇"],["Peach","🍑"],["Lemon","🍋"],["Apple","🍎"],["Orange","🍊"],["Pear","🍐"],["Melon","🍈"],["Coconut","🥥"],["Strawberry","🍓"],["Pineapple","🍍"],["Watermelon","🍉"],["Blueberry","🫐"],["Green Apple","🍏"],["Tomato","🍅"],["Avocado","🥑"],["Olive","🫒"]];
const FRUIT_EMOJI=Object.fromEntries(FRUITS);
function nextFruit(used){const f=FRUITS.find(([n])=>!used.includes(n));return f?f[0]:"Player "+(used.length+1)}
const DEF={settings:{ppb:30,extra:15,zero1:15,target:500,startCards:1,cardStep:1},draftCards:null,
  players:[],
  hands:[],draft:{},nextId:6,phase:"start",setup:{count:4,names:[]},started:false,tab:"play",step:"bid",winShown:false};
let S;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(raw));S.settings=Object.assign({},DEF.settings,S.settings);S.phase="start";return}}catch(e){}S=JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLORS=["#2f6fd0","#d1495b","#16a35a","#e08a1e","#8a4fd8","#0f9fa8","#c2410c","#4f5d75","#d63384","#5a8f29","#b8860b","#3d5a80"];
function color(p){let i=S.players.findIndex(x=>x.id===p.id);if(S.phase!=="game"||i<0)i=(parseInt(String(p.id).replace(/\D/g,""))||1)-1;return COLORS[i%COLORS.length]}
function initials(name){const w=String(name).trim().split(/\s+/);return((w[0]||"?")[0]+(w[1]?w[1][0]:(w[0]||"")[1]||"")).toUpperCase()}
function avTxt(n){const e=FRUIT_EMOJI[String(n).trim()];return e?'<span style="font-size:1.35em">'+e+'</span>':esc(initials(n))}
function av(p,lg){return'<div class="av'+(lg?" lg":"")+'" style="background:'+color(p)+'">'+avTxt(p.name)+'</div>'}
function haptic(ms){try{navigator.vibrate&&navigator.vibrate(ms||12)}catch(e){}}
const sign=v=>v>0?"+"+v:String(v);

/* ================= scoring ================= */
function pts(bid,tr){const s=S.settings;if(bid===""||tr===""||bid==null||tr==null)return null;bid=+bid;tr=+tr;
  if(bid===0&&tr===1)return +s.zero1;
  if(tr>=bid)return bid*s.ppb+(tr-bid)*s.extra;
  return -bid*s.ppb}
function totals(hands){hands=hands||S.hands;const t={};S.players.forEach(p=>t[p.id]=0);
  hands.forEach(h=>{for(const id in h.e)if(id in t){const v=pts(h.e[id].b,h.e[id].t);if(v!=null)t[id]+=v}});return t}
function ranking(hands){const t=totals(hands);const a=S.players.map((p,i)=>({...p,total:t[p.id],i}));
  a.sort((x,y)=>y.total-x.total||x.i-y.i);a.forEach(r=>r.rank=1+a.filter(o=>o.total>r.total).length);return a}
function prevRanks(){if(S.hands.length<2)return{};const r=ranking(S.hands.slice(0,-1)),m={};r.forEach(x=>m[x.id]=x.rank);return m}
function winner(){const r=ranking();if(!r.length||!S.hands.length)return null;
  if(r[0].total>=S.settings.target&&!(r[1]&&r[1].total===r[0].total))return r[0];return null}

/* ================= UI helpers ================= */
let toastT;
function toast(msg,undo){$("toastMsg").textContent=msg;const a=$("toastAct");a.classList.toggle("hide",!undo);a.onclick=()=>{undo();hideToast()};
  $("toast").classList.add("on");clearTimeout(toastT);toastT=setTimeout(hideToast,undo?5000:1800)}
function hideToast(){$("toast").classList.remove("on")}
function confirmBox(title,text,yesLabel,fn){$("dTitle").textContent=title;$("dText").textContent=text;$("dYes").textContent=yesLabel||"Yes";
  $("dialog").classList.add("on");$("dYes").onclick=()=>{$("dialog").classList.remove("on");fn()};$("dNo").onclick=()=>$("dialog").classList.remove("on")}
function openSheet(html){$("sheetBody").innerHTML='<div class="grab"></div>'+html;$("sheet").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on")}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});

/* ================= top bar ================= */
function renderTop(){const g=$("goal");$("top").classList.toggle("hide",S.phase==="start");$("goHome").classList.toggle("hide",S.phase==="start");
  if(S.phase!=="game"){g.innerHTML="";return}
  const r=ranking(),tgt=+S.settings.target,lead=r[0];
  if(!S.hands.length){g.innerHTML='<div class="goal-txt"><span>Hand <b>1</b> · '+S.players.length+' players</span><span>First to '+tgt+'</span></div><div class="bar"><i style="width:0%"></i></div>';return}
  const tied=r.filter(x=>x.total===lead.total).length>1;
  const pct=Math.max(0,Math.min(100,lead.total/tgt*100));
  g.innerHTML='<div class="goal-txt"><span>Hand <b>'+(S.hands.length+1)+'</b> · '+(tied?"Tied lead":"Leader <b>"+esc(lead.name)+"</b>")+'</span><span><b>'+lead.total+'</b> / '+tgt+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>'}

/* ================= setup flow ================= */
function renderSetup(){let h="";
  if(S.phase==="start"){
    h='<div class="hero"><div class="logo">♠</div><h2>Spades Score Card</h2><p>You play the cards.<br>We\'ll keep the score.</p>'+
      '<button class="btn primary" id="startNew">Start Game</button>'+
      (S.started?'<button class="btn secondary" id="continue" style="width:100%">Continue game · Hand '+(S.hands.length+1)+'</button>':"")+'</div>';
  }else if(S.phase==="count"){const n=S.setup.count;
    h='<button class="back" data-go="start">‹ Back</button><div class="dots"><i class="on"></i><i></i></div>'+
      '<div class="card" style="text-align:center"><h2>How many players?</h2><p class="sub">You can still add or remove players on the next screen.</p>'+
      '<div class="counter"><button data-cnt="-1" aria-label="fewer">−</button><div class="n" id="cntN">'+n+'</div><button data-cnt="1" aria-label="more">+</button></div>'+
      '<div class="quick">'+[3,4,5,6,7,8,9,10].map(k=>'<button data-setcnt="'+k+'" class="'+(k===n?"on":"")+'">'+k+'</button>').join("")+'</div></div>';
  }else if(S.phase==="names"){const nm=S.setup.names;
    h='<button class="back" data-go="count">‹ Back</button><div class="dots"><i class="on"></i><i class="on"></i></div>'+
      '<div class="card"><h2>Who\'s playing?</h2><p class="sub">'+nm.length+' players · tap a fruit to type your own name, ✕ to remove.</p>'+
      nm.map((x,i)=>'<div class="prow">'+av({id:"p"+(i+1),name:x||"?"})+'<input class="nameinp" data-sname="'+i+'" value="'+esc(x)+'" placeholder="Type a name" autocomplete="off"><button class="rm" data-srm="'+i+'" aria-label="remove">✕</button></div>').join("")+
      '<button class="btn light" id="sAdd" style="margin-top:12px">+ Add player</button></div>';
  }
  $("setup").innerHTML=h}
function syncNames(){const c=S.setup.count,nm=S.setup.names;nm.length=Math.min(nm.length,c);while(nm.length<c)nm.push(nextFruit(nm));}

/* ================= play ================= */
function dr(id){const d=S.draft[id]||{};return{b:d.b===""||d.b==null?0:d.b,t:d.t===""||d.t==null?0:d.t}}
function handCards(){if(S.draftCards!=null)return S.draftCards;const last=S.hands[S.hands.length-1];
  const c=last&&last.cards?(+last.cards+ +S.settings.cardStep):+S.settings.startCards;return Math.max(1,c)}
function needTotal(){return handCards()*S.players.length}
function allFilled(f){return S.players.length>0}
function sumOf(f){return S.players.reduce((a,p)=>a+(+dr(p.id)[f]),0)}
function renderPlay(){const step=S.step,r=ranking(),rk={};r.forEach(x=>rk[x.id]=x);
  let h='<div class="seg"><div class="'+(step==="bid"?"on":"done")+'"><span>'+(step==="bid"?"1":"✓")+'</span>Bids</div><div class="'+(step==="tricks"?"on":"")+'"><span>2</span>Tricks won</div></div>';
  h+='<div class="card"><h2>'+(step==="bid"?"What did everyone bid?":"How many tricks did each player win?")+'</h2><p class="sub">'+
     (step==="bid"?"Enter each player's bid for hand "+(S.hands.length+1)+".":"Points update as you go — green made it, red got set.")+'</p>';
  const hc=handCards();
  h+='<div class="pill" style="margin:0 0 6px;background:#fff6d6"><span>Cards per player<small style="display:block;font-weight:600;font-size:12px">'+hc+' × '+S.players.length+' players = <b>'+(hc*S.players.length)+'</b></small></span>'+
     (step==="bid"?'<div class="stepper filled" style="background:#fff"><button data-cards="-1" aria-label="fewer cards">−</button><input inputmode="numeric" id="cardsInp" value="'+hc+'"><button data-cards="1" aria-label="more cards">+</button></div>':'<span class="big">'+hc+'</span>')+'</div>';
  S.players.forEach(p=>{const d=dr(p.id),f=step==="bid"?"b":"t",val=d[f];
    let meta;
    if(step==="bid")meta=S.hands.length?'#'+rk[p.id].rank+' · '+rk[p.id].total+' pts':'Ready';
    else meta='<span class="chip">Bid '+d.b+'</span> <span id="oc-'+p.id+'">'+outcome(d)+'</span>';
    h+='<div class="prow">'+av(p)+'<div class="pinfo"><div class="pname">'+esc(p.name)+'</div><div class="pmeta">'+meta+'</div></div>'+
      '<div class="stepper'+(val!==""&&val!=null?" filled":"")+'" id="st-'+p.id+'"><button data-p="'+p.id+'" data-d="-1" aria-label="minus">−</button><input inputmode="numeric" pattern="[0-9]*" data-p="'+p.id+'" value="'+(val??"")+'" placeholder="–"><button data-p="'+p.id+'" data-d="1" aria-label="plus">+</button></div></div>'});
  h+='<div id="pill">'+pillHTML()+'</div></div>';
  $("tab-play").innerHTML=h;renderActions()}
function outcome(d){const v=pts(d.b,d.t);if(v==null)return'';return v>=0||(+d.b===0)?'<span class="chip good">Made '+sign(v)+'</span>':'<span class="chip bad">Set '+v+'</span>'}
function pillHTML(){const need=needTotal();
  if(S.step==="bid"){const s=sumOf("b");const diff=s-need;
    return'<div class="pill"><span>Total bids</span><span><span class="big">'+s+'</span> / '+need+' · '+(diff===0?"exactly":diff>0?diff+" over":(-diff)+" under")+'</span></div>'}
  const s=sumOf("t"),left=need-s;
  if(left===0)return'<div class="pill good"><span>✓ All '+need+' counted</span><span class="big">'+s+'</span></div>';
  if(left>0)return'<div class="pill warn"><span>Tricks left to assign</span><span class="big">'+left+'</span></div>';
  return'<div class="pill bad"><span>Too many tricks by</span><span class="big">'+(-left)+'</span></div>'}
function renderActions(){const a=$("actions");
  if(S.phase!=="game"){$("actionbar").classList.toggle("hide",!(S.phase==="count"||S.phase==="names"));
    if(S.phase==="count")a.innerHTML='<button class="btn primary" id="toNames">Next</button>';
    else if(S.phase==="names")a.innerHTML='<button class="btn primary" id="beginGame">Start playing</button>';
    return}
  $("actionbar").classList.toggle("hide",S.tab!=="play");
  if(S.step==="bid")a.innerHTML='<button class="btn primary" id="toTricks" '+(allFilled("b")?"":"disabled")+'>Next: tricks won →</button>';
  else a.innerHTML='<button class="btn secondary" id="toBids">← Bids</button><button class="btn primary" id="saveHand" '+(allFilled("t")?"":"disabled")+'>Save hand</button>'}
function setDraft(id,f,val){S.draft[id]=dr(id);
  if(val===""||val==null)S.draft[id][f]=0;else{let n=parseInt(val,10);if(isNaN(n))n=0;S.draft[id][f]=Math.max(0,Math.min(99,n))}save()}
function liveUpdate(id){const f=S.step==="bid"?"b":"t",d=dr(id);
  const st=$("st-"+id);if(st){st.classList.toggle("filled",d[f]!==""&&d[f]!=null);const inp=st.querySelector("input");if(document.activeElement!==inp)inp.value=d[f]??"";inp.classList.remove("bump");void inp.offsetWidth;inp.classList.add("bump")}
  const oc=$("oc-"+id);if(oc)oc.innerHTML=outcome(d);
  $("pill").innerHTML=pillHTML();renderActions()}

function saveHand(){const e={};S.players.forEach(p=>{const d=dr(p.id);e[p.id]={b:+d.b,t:+d.t}});
  const before=ranking();const bRank={};before.forEach(x=>bRank[x.id]=x.rank);
  const prevCards=S.draftCards;S.hands.push({e,cards:handCards()});S.draftCards=null;const prevDraft=S.draft;S.draft={};S.step="bid";save();haptic(25);
  renderAll();showResults(bRank,prevDraft,prevCards)}
function showResults(bRank,prevDraft,prevCards){const hand=S.hands[S.hands.length-1],r=ranking();
  const rows=S.players.map(p=>({p,e:hand.e[p.id],v:pts(hand.e[p.id].b,hand.e[p.id].t)})).sort((a,b)=>b.v-a.v);
  const best=rows[0];
  let h='<h2>Hand '+S.hands.length+' results</h2><p class="sub">'+(best.v>0?"🔥 Top hand: <b>"+esc(best.p.name)+"</b> "+sign(best.v):"Tough hand for everyone!")+'</p>';
  rows.forEach(x=>{const nr=r.find(z=>z.id===x.p.id).rank,or=bRank[x.p.id]||nr;const made=x.v>=0;
    h+='<div class="res">'+av(x.p)+'<div class="pinfo"><div class="pname">'+esc(x.p.name)+'</div><div class="pmeta">Bid '+x.e.b+' · Won '+x.e.t+' · '+(made?'<span style="color:var(--good);font-weight:800">✓ Made</span>':'<span style="color:var(--bad);font-weight:800">✗ Set</span>')+
      ' · #'+nr+(S.hands.length>1&&or!==nr?'<span class="mv '+(nr<or?"up":"down")+'">'+(nr<or?"▲":"▼")+Math.abs(or-nr)+'</span>':'')+'</div></div><div class="delta '+(made?"good":"bad")+'">'+sign(x.v)+'</div></div>'});
  h+='<div style="display:flex;gap:10px;margin-top:14px"><button class="btn light" id="undoHand" style="flex:0 0 auto;width:auto;padding:16px 18px">Undo</button><button class="btn primary" id="nextHand">'+(winner()?"See the winner 🏆":"Next hand")+'</button></div>';
  openSheet(h);
  $("undoHand").onclick=()=>{const hc=S.hands.pop().cards;S.draftCards=hc;S.draft=prevDraft;S.step="tricks";save();closeSheet();renderAll();toast("Hand removed — edit and save again")};
  $("nextHand").onclick=()=>{closeSheet();if(winner()&&!S.winShown)showWin()}}

/* ================= winner ================= */
function showWin(){const w=winner();if(!w)return;S.winShown=true;save();haptic([30,60,30]);
  const r=ranking();
  $("win").innerHTML='<div class="trophy">🏆</div>'+av(w,true).replace('class="av lg"','class="av lg" style="margin:10px auto;background:'+color(w)+'"')+
    '<h2>'+esc(w.name)+' wins!</h2><p>'+w.total+' points after '+S.hands.length+' hands'+(r[1]?' · '+(w.total-r[1].total)+' ahead of '+esc(r[1].name):'')+'</p>'+
    '<button class="btn primary" id="winNew">Play again</button><button class="btn secondary" id="winClose" style="width:100%;max-width:340px">View final scores</button>';
  $("win").classList.add("on");confetti();
  $("winNew").onclick=()=>{$("win").classList.remove("on");newGameFlow()};
  $("winClose").onclick=()=>{$("win").classList.remove("on");S.tab="board";showPhase()}}
function confetti(){const c=$("confetti"),cols=["#f2c14e","#16a35a","#2f6fd0","#d1495b","#ffffff","#8a4fd8"];let h="";
  for(let i=0;i<90;i++)h+='<i style="left:'+Math.random()*100+'%;background:'+cols[i%cols.length]+';animation-duration:'+(2+Math.random()*2.5)+'s;animation-delay:'+Math.random()*.8+'s;transform:rotate('+Math.random()*360+'deg)"></i>';
  c.innerHTML=h;setTimeout(()=>c.innerHTML="",5500)}

/* ================= leaderboard ================= */
function renderBoard(){const r=ranking(),tgt=+S.settings.target,pr=prevRanks(),lead=r[0];
  if(!S.hands.length){$("tab-board").innerHTML='<div class="card" style="text-align:center"><div style="font-size:48px">🏆</div><h2>No scores yet</h2><p class="sub">Play the first hand and the leaderboard will appear here.</p></div>';return}
  let h='<div class="eyebrow">After '+S.hands.length+' hand'+(S.hands.length>1?"s":"")+' · first to '+tgt+'</div><div class="card"><div class="podium">';
  const order=[r[1],r[0],r[2]].filter(Boolean);
  order.forEach(x=>{const pos=x===r[0]?1:x===r[1]?2:3;h+='<div class="pod p'+pos+'">'+av(x,pos===1)+'<div class="nm">'+esc(x.name)+'</div><div class="sc'+(x.total<0?" neg":"")+'">'+x.total+'</div><div class="block">'+x.rank+'</div></div>'});
  h+='</div></div><div class="card">';
  r.forEach(x=>{const pct=Math.max(0,Math.min(100,x.total/tgt*100)),gap=lead.total-x.total,o=pr[x.id];
    h+='<div class="lrow"><div class="lrank">'+x.rank+'</div>'+av(x)+'<div class="pinfo"><div class="pname">'+esc(x.name)+
      (o&&o!==x.rank?'<span class="mv '+(x.rank<o?"up":"down")+'">'+(x.rank<o?"▲":"▼")+Math.abs(o-x.rank)+'</span>':'')+
      '</div><div class="bar"><i style="width:'+pct+'%"></i></div></div><div class="lscore'+(x.total<0?" neg":"")+'">'+x.total+'<small>'+(gap===0?(x.rank===1?"leading":""):gap+" behind")+'</small></div></div>'});
  h+='</div>';$("tab-board").innerHTML=h}

/* ================= history ================= */
function renderHistory(){let h='<div class="card"><h2>Scores by hand</h2><p class="sub">Big number = points · small = bid / won</p>';
  if(!S.hands.length)h+='<p class="sub">No hands saved yet.</p>';
  else{const t=totals();h+='<div class="tbl"><table><thead><tr><th>#</th>'+S.players.map(p=>'<th>'+esc(p.name)+'</th>').join("")+'<th></th></tr></thead><tbody>';
    S.hands.forEach((hd,i)=>{h+='<tr><td class="h">'+(i+1)+(hd.cards?'<small>'+hd.cards+' 🂠</small>':'')+'</td>'+S.players.map(p=>{const e=hd.e[p.id];if(!e)return"<td>–</td>";const v=pts(e.b,e.t);
      return'<td><b class="'+(v<0?"neg":"")+'">'+v+'</b><small>'+e.b+' / '+e.t+'</small></td>'}).join("")+'<td><button class="x" data-del="'+i+'" aria-label="delete hand">✕</button></td></tr>'});
    h+='</tbody><tfoot><tr><td>Σ</td>'+S.players.map(p=>'<td class="'+(t[p.id]<0?"neg":"")+'">'+t[p.id]+'</td>').join("")+'<td></td></tr></tfoot></table></div>'}
  h+='</div><div class="card"><button class="btn light" id="copyScores">Copy scores to share</button><div style="height:10px"></div><button class="btn danger" id="newGame">New game</button></div>';
  $("tab-history").innerHTML=h}

/* ================= settings ================= */
const SETS=[["ppb","Points per bid","Per trick bid, when you make it"],["extra","Points per extra trick","Each trick won above your bid"],["zero1","Bid 0, win 1","Bid zero and take exactly one trick"],["target","Play to","Score that wins the game"],["startCards","Starting cards per player","Cards each player gets in hand 1"],["cardStep","Change each hand","+1 = one more card every hand, 0 = same, −1 = one fewer"]];
function renderSettings(){let h='<div class="eyebrow">Players</div><div class="card">';
  S.players.forEach(p=>{h+='<div class="prow">'+av(p)+'<input class="nameinp" data-name="'+p.id+'" value="'+esc(p.name)+'"><button class="rm" data-rm="'+p.id+'" aria-label="remove">✕</button></div>'});
  h+='<div class="prow">'+'<div class="av" style="background:#d8dfdb">+</div><input class="nameinp" id="newName" placeholder="Add a player (blank = fruit name)" autocomplete="off"><button class="rm" id="addP" style="background:var(--good-bg);color:var(--good)" aria-label="add">✓</button></div></div>';
  h+='<div class="eyebrow">Scoring</div><div class="card">';
  SETS.forEach(([k,l,d])=>{h+='<div class="srow"><label>'+l+'<small>'+d+'</small></label><input class="num" inputmode="'+(k==="cardStep"?"text":"numeric")+'" data-set="'+k+'" value="'+S.settings[k]+'"></div>'});
  h+='<p class="sub" style="margin:10px 0 0">Missing your bid loses bid × points per bid. Changes recalculate every hand.</p></div>';
  h+='<div class="card"><button class="btn light" id="resetSet">Restore default scoring</button></div>';
  $("tab-settings").innerHTML=h}


/* ================= side leaderboard ================= */
function sideVisible(){return S.phase==="game"&&(S.tab==="play"||S.tab==="history")}
function renderSide(){const show=sideVisible();
  $("side").classList.toggle("hide",!show);$("edge").classList.toggle("hide",!show);$("layout").classList.toggle("noside",!show);
  if(!show){closeSide();return}
  const r=ranking(),pr=prevRanks(),lead=r[0];
  $("edgeTxt").textContent=S.hands.length?lead.total:"0";
  let h='<h3>🏆 Leaderboard</h3><p class="sub">'+(S.hands.length?"After "+S.hands.length+" hand"+(S.hands.length>1?"s":"")+" · first to "+S.settings.target:"Scores appear after hand 1")+'</p>';
  r.forEach(x=>{const o=pr[x.id],gap=lead.total-x.total;
    h+='<div class="srank'+(x.rank===1&&S.hands.length?" first":"")+'"><div class="n">'+x.rank+'</div>'+av(x)+'<div class="nm">'+esc(x.name)+
      (o&&o!==x.rank?'<span class="mv '+(x.rank<o?"up":"down")+'">'+(x.rank<o?"▲":"▼")+Math.abs(o-x.rank)+'</span>':'')+
      '</div><div class="sc'+(x.total<0?" neg":"")+'">'+x.total+(S.hands.length?'<small>'+(gap===0?(x.rank===1?"leading":"tied"):"−"+gap)+'</small>':'')+'</div></div>'});
  $("side").innerHTML=h}
function openSide(){$("side").classList.add("open");$("sidescrim").classList.add("on")}
function closeSide(){$("side").classList.remove("open");$("sidescrim").classList.remove("on")}
$("edge").addEventListener("click",openSide);$("sidescrim").addEventListener("click",closeSide);
/* ================= routing ================= */
function showPhase(){const game=S.phase==="game";
  $("setup").classList.toggle("hide",game);$("tabs").classList.toggle("hide",!game);
  ["play","board","history","settings"].forEach(t=>$("tab-"+t).classList.toggle("hide",!game||S.tab!==t));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  if(!game)renderSetup();renderTop();renderActions();renderSide();window.scrollTo(0,0)}
function renderAll(){renderTop();if(S.phase==="game"){renderPlay();renderBoard();renderHistory();renderSettings()}showPhase()}
function newGameFlow(){S.hands=[];S.draft={};S.draftCards=null;S.step="bid";S.winShown=false;S.setup.count=S.setup.count||4;S.setup.names=[];S.phase="count";save();renderAll()}
function refreshScores(){renderTop();renderBoard();renderHistory();renderSide();if(S.tab==="play")renderPlay()}

/* ================= events ================= */
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;haptic(8);if(S.tab==="play")renderPlay();showPhase();return}
  if(b.id==="goHome"){S.phase="start";save();showPhase();return}
  if(b.id==="startNew"){if(S.started&&S.hands.length)confirmBox("Start a new game?","The current game ("+S.hands.length+" hands) will be cleared.","Start new",newGameFlow);else newGameFlow();return}
  if(b.id==="continue"){S.phase="game";renderAll();return}
  if(b.dataset.go){S.phase=b.dataset.go;showPhase();return}
  if(b.dataset.cnt){S.setup.count=Math.max(2,Math.min(20,S.setup.count+ +b.dataset.cnt));haptic(8);renderSetup();return}
  if(b.dataset.setcnt){S.setup.count=+b.dataset.setcnt;haptic(8);renderSetup();return}
  if(b.id==="toNames"){syncNames();S.phase="names";showPhase();return}
  if(b.dataset.srm!=null){if(S.setup.names.length<=2){toast("You need at least 2 players");return}S.setup.names.splice(+b.dataset.srm,1);S.setup.count=S.setup.names.length;renderSetup();return}
  if(b.id==="sAdd"){S.setup.names.push(nextFruit(S.setup.names));S.setup.count=S.setup.names.length;renderSetup();const ins=document.querySelectorAll("input[data-sname]");ins[ins.length-1].focus();return}
  if(b.id==="beginGame"){const used=[];const nm=S.setup.names.map(x=>{const v=x.trim()||nextFruit(used.concat(S.setup.names.map(s=>s.trim())));used.push(v);return v});
    S.players=nm.map(n=>({id:"p"+(S.nextId++),name:n}));S.hands=[];S.draft={};S.draftCards=null;S.step="bid";S.winShown=false;S.started=true;S.phase="game";S.tab="play";save();haptic(20);renderAll();toast("Game on — good luck! ♠");return}
  if(b.dataset.d&&b.dataset.p){const id=b.dataset.p,f=S.step==="bid"?"b":"t",cur=dr(id)[f];
    const n=Math.max(0,+cur+ +b.dataset.d);setDraft(id,f,n);haptic(8);liveUpdate(id);return}
  if(b.dataset.cards){S.draftCards=Math.max(1,Math.min(52,handCards()+ +b.dataset.cards));save();haptic(8);renderPlay();return}
  if(b.id==="toTricks"){S.step="tricks";save();renderPlay();window.scrollTo(0,0);return}
  if(b.id==="toBids"){S.step="bid";save();renderPlay();window.scrollTo(0,0);return}
  if(b.id==="saveHand"){const s=sumOf("t"),need=needTotal();
    if(s!==need)confirmBox("Tricks don't add up","Counted "+s+" of "+need+" tricks. Save anyway?","Save anyway",saveHand);else saveHand();return}
  if(b.dataset.del!=null){const i=+b.dataset.del,removed=S.hands[i];
    S.hands.splice(i,1);save();refreshScores();toast("Hand "+(i+1)+" deleted",()=>{S.hands.splice(i,0,removed);save();refreshScores()});return}
  if(b.id==="newGame"){confirmBox("Start a new game?","All "+S.hands.length+" hands will be cleared and you'll pick players again.","Start new",newGameFlow);return}
  if(b.id==="copyScores"){const r=ranking();const txt="♠ Spades Score Card — after "+S.hands.length+" hands\n"+r.map(x=>x.rank+". "+x.name+": "+x.total).join("\n");
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("Scores copied — paste them anywhere"),()=>toast("Couldn't copy"));else toast("Couldn't copy");return}
  if(b.id==="addP"){const v=$("newName").value.trim()||nextFruit(S.players.map(x=>x.name));S.players.push({id:"p"+(S.nextId++),name:v});save();renderAll();toast(v+" joined the game");return}
  if(b.dataset.rm){const p=S.players.find(x=>x.id===b.dataset.rm);if(S.players.length<=2){toast("You need at least 2 players");return}
    confirmBox("Remove "+p.name+"?","Their scores will be removed from the leaderboard.","Remove",()=>{S.players=S.players.filter(x=>x.id!==p.id);delete S.draft[p.id];save();renderAll()});return}
  if(b.id==="resetSet"){const old={...S.settings};S.settings={...DEF.settings};save();renderAll();toast("Default scoring restored",()=>{S.settings=old;save();renderAll()});return}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.sname!=null){S.setup.names[+t.dataset.sname]=t.value;const a=t.parentNode.querySelector(".av");if(a)a.innerHTML=avTxt(t.value||"?");return}
  if(t.id==="cardsInp"){const n=parseInt(t.value,10);if(!isNaN(n)&&n>=1){S.draftCards=Math.min(52,n);save();$("pill").innerHTML=pillHTML();const sm=t.closest(".pill").querySelector("small");if(sm)sm.innerHTML=n+" × "+S.players.length+" players = <b>"+(n*S.players.length)+"</b>"}return}
  if(t.dataset.p){setDraft(t.dataset.p,S.step==="bid"?"b":"t",t.value.trim());liveUpdate(t.dataset.p);return}
  if(t.dataset.name){const p=S.players.find(x=>x.id===t.dataset.name);p.name=t.value;save();renderTop();renderBoard();renderHistory();renderSide();return}
  if(t.dataset.set){const n=parseInt(t.value,10);if(!isNaN(n)){S.settings[t.dataset.set]=n;save();refreshScores()}return}
});
document.addEventListener("keydown",e=>{if(e.target.id==="newName"&&e.key==="Enter")$("addP").click()});
document.addEventListener("focusin",e=>{if(e.target.matches(".stepper input,.num"))e.target.select&&e.target.select()});
renderAll();
</script>
</body>
</html>
